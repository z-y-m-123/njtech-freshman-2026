<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">南工起点站</title>
  <desc id="desc">面向南京工业大学新生的信息导航，包含七个漂浮的蓝色功能气泡。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cfeeff"/><stop offset=".58" stop-color="#f5fbff"/><stop offset="1" stop-color="#e5f4ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#276e9d" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <g fill="none" stroke="#74b9e4" opacity=".35"><circle cx="1070" cy="-55" r="205"/><circle cx="1070" cy="-55" r="250" opacity=".55"/><circle cx="1070" cy="-55" r="310" opacity=".35"/></g>
  <text x="76" y="69" fill="#4a7f9f" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="3">NJTECH STARTING POINT</text>
  <text x="1055" y="69" fill="#4a7f9f" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" text-anchor="end">2026 新生指南</text>
  <text x="76" y="178" fill="#3680ae" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" letter-spacing="3">A FRIENDLY GUIDE FOR YOUR FIRST DAY</text>
  <text x="76" y="250" fill="#173e62" font-family="Microsoft YaHei, sans-serif" font-size="58" font-weight="700">第一次走进南工，</text>
  <text x="76" y="323" fill="#2783bd" font-family="Microsoft YaHei, sans-serif" font-size="58" font-weight="700">从这里开始。</text>
  <text x="76" y="374" fill="#5c7d92" font-family="Microsoft YaHei, sans-serif" font-size="20">把报到、生活、办事与成长的信息，整理成随时可打开的校园导航。</text>
  <g transform="translate(76 414)"><rect width="182" height="48" rx="24" fill="#1778b4"/><text x="91" y="30" fill="#fff" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle">打开新生指南  →</text></g>
  <g filter="url(#shadow)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;8 -13;0 0" dur="7.5s" repeatCount="indefinite"/><circle cx="575" cy="416" r="68" fill="#faffff" fill-opacity=".86" stroke="#63addb"/><text x="575" y="409" text-anchor="middle" fill="#155d8e" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">报到准备</text><text x="575" y="435" text-anchor="middle" fill="#6c8da2" font-family="Microsoft YaHei, sans-serif" font-size="13">清单 · 路线</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;-10 11;0 0" dur="8.6s" repeatCount="indefinite"/><circle cx="706" cy="315" r="78" fill="#d4f0ff" fill-opacity=".9" stroke="#55a8db"/><text x="706" y="307" text-anchor="middle" fill="#176eaa" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700">校园地图</text><text x="706" y="334" text-anchor="middle" fill="#5f869f" font-family="Microsoft YaHei, sans-serif" font-size="13">抵达 · 导航</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;7 -11;0 0" dur="7.1s" repeatCount="indefinite"/><circle cx="850" cy="430" r="73" fill="#faffff" fill-opacity=".86" stroke="#63addb"/><text x="850" y="422" text-anchor="middle" fill="#155d8e" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">宿舍生活</text><text x="850" y="448" text-anchor="middle" fill="#6c8da2" font-family="Microsoft YaHei, sans-serif" font-size="13">介绍 · 图集</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;-6 10;0 0" dur="8.2s" repeatCount="indefinite"/><circle cx="972" cy="276" r="66" fill="#e7f7ff" fill-opacity=".92" stroke="#6db7e0"/><text x="972" y="269" text-anchor="middle" fill="#155d8e" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700">办事服务</text><text x="972" y="294" text-anchor="middle" fill="#6c8da2" font-family="Microsoft YaHei, sans-serif" font-size="12">课表 · 网络</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;9 8;0 0" dur="7.8s" repeatCount="indefinite"/><circle cx="1081" cy="425" r="69" fill="#dff3ff" fill-opacity=".9" stroke="#62add9"/><text x="1081" y="418" text-anchor="middle" fill="#155d8e" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700">官方入口</text><text x="1081" y="443" text-anchor="middle" fill="#6c8da2" font-family="Microsoft YaHei, sans-serif" font-size="12">信息 · 查询</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;-8 -9;0 0" dur="7.2s" repeatCount="indefinite"/><circle cx="719" cy="535" r="57" fill="#e7f7ff" fill-opacity=".92" stroke="#6db7e0"/><text x="719" y="529" text-anchor="middle" fill="#155d8e" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">新生留言</text><text x="719" y="551" text-anchor="middle" fill="#6c8da2" font-family="Microsoft YaHei, sans-serif" font-size="11">提问 · 互助</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;5 -8;0 0" dur="8.9s" repeatCount="indefinite"/><circle cx="936" cy="540" r="59" fill="#faffff" fill-opacity=".86" stroke="#63addb"/><text x="936" y="534" text-anchor="middle" fill="#155d8e" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">成长导航</text><text x="936" y="556" text-anchor="middle" fill="#6c8da2" font-family="Microsoft YaHei, sans-serif" font-size="11">竞赛 · 升学</text></g>
  </g>
  <text x="76" y="578" fill="#5c88a5" font-family="Microsoft YaHei, sans-serif" font-size="14">信息在这里汇合，答案从这里展开。</text>
</svg>
