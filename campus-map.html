<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="南工起点站江浦校区地点地图：搜索地点、筛选类别、查看资料与导航。" />
    <title>校园地图 · 南工起点站</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="campus-map.css" />
  </head>
  <body>
    <header class="map-header">
      <a href="index.html" class="map-brand"><span>南工</span>起点站</a>
      <nav aria-label="页面导航"><a href="index.html" class="map-back">← 返回首页</a><a href="campus-tools.html" class="map-back">生活资料</a><a href="assets/njtech-jiangpu-campus-map-optimized.jpg" class="map-download" download="南京工业大学江浦校区高清地图.jpg">下载高清图</a></nav>
    </header>
    <main class="map-shell">
      <aside class="map-sidebar" aria-label="地点检索">
        <p class="map-kicker">江浦校区 · 地点参考</p>
        <h1>校园地图</h1>
        <p class="map-intro">找位置、看简介，再按需打开实时导航。</p>
        <label class="map-search" for="mapSearch"><span>搜索地点</span><input id="mapSearch" type="search" placeholder="图书馆、食堂、校门" autocomplete="off" /></label>
        <div class="map-filters" id="mapFilters" aria-label="地点分类">
          <button class="is-active" type="button" data-category="all">全部</button><button type="button" data-category="gate">校门</button><button type="button" data-category="teaching">教学</button><button type="button" data-category="living">生活</button><button type="button" data-category="food">餐饮</button><button type="button" data-category="sports">运动</button><button type="button" data-category="scenery">景观</button><button type="button" data-category="transport">交通</button>
        </div>
        <div class="map-result-heading"><strong id="mapCount">0 个地点</strong><small>可继续补充</small></div>
        <div id="mapResults" class="map-results"></div>
      </aside>
      <section class="map-main" aria-label="江浦校区地图">
        <div class="map-view-switch" aria-label="地图视图"><button class="is-active" type="button" data-map-view="live" aria-pressed="true">实时地图</button><button type="button" data-map-view="guide" aria-pressed="false">高清图导览</button></div>
        <div id="liveCampusMap" class="live-campus-map"></div>
        <div id="highResCampusGuide" class="high-res-campus-guide" hidden><div class="high-res-guide-canvas"><img src="assets/njtech-jiangpu-campus-map-optimized.jpg" alt="南京工业大学江浦校区高清校园地图" /><div id="highResGuideMarkers" class="high-res-guide-markers" aria-label="高清图宿舍标记"></div></div></div>
        <div class="map-legend" aria-label="使用提示"><strong id="mapLegendTitle">地点定位参考</strong><span id="mapLegendCopy">公开 BD-09 点位已转换为高德底图坐标</span></div>
      </section>
    </main>
    <aside id="placeDetail" class="place-detail" hidden aria-live="polite">
      <button class="detail-close" type="button" data-close-place aria-label="关闭地点详情">关闭</button>
      <p id="placeDetailMeta"></p><h2 id="placeDetailTitle"></h2><p id="placeDetailBody"></p>
      <figure id="placeDetailFigure" class="place-detail-figure" hidden><img id="placeDetailImage" alt="" /><figcaption id="placeDetailCaption"></figcaption></figure>
      <p id="placeDetailSource" class="detail-source"></p>
      <div class="detail-actions"><button id="placeDetailGallery" type="button" hidden>查看更多图片</button><a id="placeDetailPanorama" target="_blank" rel="noreferrer" hidden>查看 3D 全景</a><a id="placeDetailNav" target="_blank" rel="noreferrer">打开实时导航</a><a href="assets/njtech-jiangpu-campus-map-optimized.jpg" download="南京工业大学江浦校区高清地图.jpg">下载高清图</a></div>
    </aside>
    <dialog id="dormGalleryDialog" class="dorm-gallery-dialog" aria-labelledby="dormGalleryTitle">
      <div class="dorm-gallery-head"><div><p>宿舍实拍图集</p><h2 id="dormGalleryTitle">宿舍图片</h2></div><button type="button" data-close-dorm-gallery aria-label="关闭宿舍图集">关闭</button></div>
      <div id="dormGalleryTabs" class="dorm-gallery-tabs" aria-label="选择宿舍区"></div>
      <div id="dormGalleryGrid" class="dorm-gallery-grid"></div>
      <p class="dorm-gallery-note">照片用于了解宿舍区环境参考，具体宿舍、床位与设施以学校实际分配和现场情况为准。</p>
    </dialog>
    <footer class="map-footer">南工起点站 · 重要信息以学校当年官方通知为准。 <a class="mirror-note" href="https://njtechstart.top/">Official site: njtechstart.top</a></footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="data/campus-map-data.js"></script><script src="campus-map.js"></script>
  </body>
</html>
